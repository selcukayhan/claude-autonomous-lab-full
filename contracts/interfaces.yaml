# Interface Contract — root template
#
# The architecture agent COPIES this template into specs/<feature_id>/contracts/interfaces.yaml
# and fills it in. Coding agents are forbidden from changing interfaces post plan_lock_review
# unless a public_api_change_post_lock HITL gate is approved.
#
# This root file stays as the template/skeleton — do not edit per-feature content here.

version: "1.0.0"
feature_id: TEMPLATE
spec_ref: TEMPLATE

# HTTP/REST interfaces (OpenAPI-lite). For full OpenAPI, link out via 'openapi_ref'.
http:
  - id: H1
    method: GET                 # GET | POST | PUT | PATCH | DELETE
    path: /example/{id}
    summary: ""
    owner: coding-be
    request:
      path_params: []           # [{name, type, required}]
      query_params: []
      body_shape_ref: ""        # JSON Schema $ref or inline path
    responses:
      "200":
        body_shape_ref: ""
      "4xx": { description: "" }
      "5xx": { description: "" }
    auth: none                  # none | bearer | session | mtls
    spec_criterion_refs: []     # which AC this endpoint satisfies

# Event / message interfaces.
events:
  - id: E1
    topic: ""
    direction: emit             # emit | consume
    payload_shape_ref: ""
    delivery: at_least_once     # at_most_once | at_least_once | exactly_once
    owner: coding-be

# Internal module APIs (FE<->BE, BE<->BE in-process, library boundaries).
modules:
  - id: M1
    name: ""
    owner: coding-be
    exported_symbols: []        # list of stable function/type names
    stability: experimental     # experimental | stable | deprecated

# Shared data shapes referenced above.
shapes:
  - id: S1
    name: ""
    json_schema_ref: ""

links:
  spec: ""
  system_design: ""
  openapi_ref: ""
