# System Design Contract — root template
#
# The architecture agent COPIES this template into specs/<feature_id>/contracts/system_design.yaml
# and fills it in. The locked plan references that path via plan.contracts.system_design.
#
# This root file stays as the template/skeleton — do not edit per-feature content here.

version: "1.0.0"
feature_id: TEMPLATE
spec_ref: TEMPLATE

context:
  problem_summary: ""        # one-sentence pull from spec.context
  primary_actors: []         # e.g. [end-user, admin, scheduler-job]
  scope: included            # included | partially_included | out_of_scope notes

architecture_style: ""        # monolith | modular_monolith | microservices | serverless | hybrid

components:
  - id: C1
    name: ""
    responsibility: ""
    owner: coding-be          # coding-fe | coding-be | coding-devops
    interfaces: []             # IDs from interfaces.yaml
    dependencies: []           # other component IDs

data_stores:
  - id: D1
    kind: ""                  # postgres | redis | s3 | filesystem | etc.
    schema_ref: ""            # path to migration / schema file when known
    owner: coding-be

data_flow:
  - id: F1
    from: C1
    to: C2
    via: ""                   # interface ID or transport
    payload_shape_ref: ""

cross_cutting:
  observability: ""
  security_model: ""
  failure_modes: []           # documented failure scenarios + handling strategy

decisions:
  - id: ADR1
    title: ""
    context: ""
    decision: ""
    consequences: ""

links:
  spec: ""                    # specs/<feature_id>/spec.md
  interfaces: ""              # specs/<feature_id>/contracts/interfaces.yaml
